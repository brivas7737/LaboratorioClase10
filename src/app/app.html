<a-scene>
  <a-sky
    src="/images/panorama.jpg"
    rotation="0 -90 0">
  </a-sky>

  <a-camera position="0 1.6 0">
    <a-cursor></a-cursor>
  </a-camera>

  <a-box
    position="0 1.5 -3"
    width="1"
    height="1"
    depth="1"
    [attr.color]="color"
    (click)="color = color === 'tomato' ? 'blue' : 'tomato'">
  </a-box>
</a-scene>
